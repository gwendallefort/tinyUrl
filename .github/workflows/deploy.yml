# Zero-downtime deploy to Hostinger (Capistrano-style releases).
#
# Remote layout under HOSTINGER_PATH:
#   current/          -> symlink to the live release (web root should point at current/public)
#   releases/<id>/    -> immutable deploy snapshots (rsync target)
#   shared/storage/   -> persistent logs, cache, sessions, uploads (symlinked into each release)
#
# Flow:
#   1. Build and test on the runner (Composer, npm, PHPUnit).
#   2. rsync the artifact into a new releases/<timestamp>-<sha>/ directory.
#      The live `current` tree is never modified during rsync, so traffic keeps serving the old release.
#   3. Wire shared storage into the new release, run migrate + Laravel caches via Infisical.
#   4. Atomically repoint `current` to the new release (symlink swap).
#   5. Remove old release directories, keeping BACKUP_KEEP_COUNT previous ones for rollback.
#
# First deploy after switching to this layout: if `current` is still a real directory,
# it is moved aside once before the symlink is created (brief gap only on that migration).
name: Deploy to Hostinger

on:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read

env:
  DEPLOY_ENV: &deploy_env ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: *deploy_env
    env:
      HOSTINGER_USER: ${{ vars.HOSTINGER_USER }}
      HOSTINGER_HOST: ${{ vars.HOSTINGER_HOST }}
      HOSTINGER_PORT: ${{ vars.HOSTINGER_PORT }}
      HOSTINGER_PATH: ${{ vars.HOSTINGER_PATH }}
      INFISICAL_ENV: *deploy_env
      BACKUP_KEEP_COUNT: ${{ vars.BACKUP_KEEP_COUNT || '5' }}
      SSH_OPTS: >-
        -o IdentitiesOnly=yes
        -o StrictHostKeyChecking=no
        -o UserKnownHostsFile=/dev/null
        -o ConnectTimeout=60
        -o ServerAliveInterval=30
        -o ServerAliveCountMax=6
        -o TCPKeepAlive=yes
    steps:
      - name: Validate variables
        run: |
          : "${HOSTINGER_USER:?Set HOSTINGER_USER in GitHub Actions variables}"
          : "${HOSTINGER_HOST:?Set HOSTINGER_HOST in GitHub Actions variables}"
          : "${HOSTINGER_PORT:?Set HOSTINGER_PORT in GitHub Actions variables}"
          : "${HOSTINGER_PATH:?Set HOSTINGER_PATH in GitHub Environment variables}"
      - name: Normalize HOSTINGER_PATH (strip CR)
        run: |
          # GitHub vars pasted from Windows often contain \r and break multiline SSH commands.
          printf 'HOSTINGER_PATH=%s\n' "${HOSTINGER_PATH//$'\r'/}" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v6

      # --- Build & test on the runner (nothing touches the server yet) ---

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, ctype, json, openssl, pdo, tokenizer, xml, bcmath
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies (including dev for tests)
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel .env for tests
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Run backend tests
        run: php artisan test --without-tty

      - name: Reinstall production Composer dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend assets
        run: npm run build

      # --- Remote deploy (releases + atomic cutover) ---

      # Write key to a file instead of ssh-add stdin — avoids "error in libcrypto" when
      # the secret has wrong newlines, BOM, or non-PEM content (common GitHub Secrets issues).
      - name: Configure SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/hostinger_deploy"
          chmod 600 "$HOME/.ssh/hostinger_deploy"

      # HOSTINGER_PATH often uses ~/... from Hostinger docs; inside remote "..." ~ does not expand
      # and rsync resolves it as $HOME + literal "/~/..." — fetch remote $HOME and make path absolute.
      - name: Resolve HOSTINGER_PATH to absolute path
        run: |
          REMOTE_HOME=$(ssh -i "$HOME/.ssh/hostinger_deploy" $SSH_OPTS \
            -p "$HOSTINGER_PORT" \
            "${HOSTINGER_USER}@${HOSTINGER_HOST}" \
            "printf '%s' \"\$HOME\"")
          if [[ "${HOSTINGER_PATH}" =~ ^~(/|$) ]]; then
            HOSTINGER_PATH="${HOSTINGER_PATH/#\~/$REMOTE_HOME}"
          fi
          printf 'HOSTINGER_PATH=%s\n' "$HOSTINGER_PATH" >> "$GITHUB_ENV"

      # Create a unique release folder and ensure shared storage dirs exist on the server.
      # shared/storage survives across releases so logs, sessions, and uploads are not lost.
      - name: Prepare release directory
        run: |
          RELEASE_ID="$(TZ=Europe/Paris date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          RELEASE_PATH="${HOSTINGER_PATH}/releases/${RELEASE_ID}"
          {
            echo "RELEASE_ID=${RELEASE_ID}"
            echo "RELEASE_PATH=${RELEASE_PATH}"
          } >> "$GITHUB_ENV"
          ssh -i "$HOME/.ssh/hostinger_deploy" $SSH_OPTS \
            -p "$HOSTINGER_PORT" \
            "${HOSTINGER_USER}@${HOSTINGER_HOST}" \
            "mkdir -p \"${RELEASE_PATH}\" \
              \"${HOSTINGER_PATH}/shared/storage/app/public\" \
              \"${HOSTINGER_PATH}/shared/storage/framework/cache\" \
              \"${HOSTINGER_PATH}/shared/storage/framework/sessions\" \
              \"${HOSTINGER_PATH}/shared/storage/framework/views\" \
              \"${HOSTINGER_PATH}/shared/storage/logs\""

      # Sync into the new release only — not into `current`.
      # Excludes are mirrored on the server side: .env comes from Infisical; storage dirs are shared.
      - name: Deploy release (rsync off live path)
        run: |
          rsync -avz --delete \
            -e "ssh -i $HOME/.ssh/hostinger_deploy $SSH_OPTS -p $HOSTINGER_PORT" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='storage/logs' \
            --exclude='storage/framework/cache' \
            --exclude='storage/framework/sessions' \
            --exclude='storage/framework/views' \
            --exclude='storage/app/public' \
            ./ \
            "${HOSTINGER_USER}@${HOSTINGER_HOST}:${RELEASE_PATH}"

      # On the server: link shared storage, warm the new release, then swap `current` atomically.
      # Migrate/cache run before cutover so a failed migration never becomes live.
      - name: Activate release (shared storage + migrate + atomic symlink)
        run: |
          ssh -i "$HOME/.ssh/hostinger_deploy" $SSH_OPTS \
            -p "$HOSTINGER_PORT" "${HOSTINGER_USER}@${HOSTINGER_HOST}" \
            "bash -lc '
              set -euo pipefail
              HOSTINGER_PATH=\"${HOSTINGER_PATH}\"
              RELEASE_PATH=\"${RELEASE_PATH}\"
              SHARED_STORAGE=\"\${HOSTINGER_PATH}/shared/storage\"
              CURRENT=\"\${HOSTINGER_PATH}/current\"

              # One-time migration: copy real storage dirs from the old live tree into shared/.
              # Skipped once storage paths are already symlinks (subsequent deploys).
              if [ -d \"\${CURRENT}/storage\" ]; then
                for rel in app/public framework/cache framework/sessions framework/views logs; do
                  if [ -d \"\${CURRENT}/storage/\${rel}\" ] && [ ! -L \"\${CURRENT}/storage/\${rel}\" ]; then
                    rsync -a \"\${CURRENT}/storage/\${rel}/\" \"\${SHARED_STORAGE}/\${rel}/\"
                  fi
                done
              fi

              # Point this release at shared storage (replace rsynced empty dirs with symlinks).
              mkdir -p \"\${RELEASE_PATH}/storage/framework\" \"\${RELEASE_PATH}/storage/app\" \"\${RELEASE_PATH}/bootstrap/cache\"
              for rel in app/public framework/cache framework/sessions framework/views logs; do
                rm -rf \"\${RELEASE_PATH}/storage/\${rel}\"
                ln -sfn \"\${SHARED_STORAGE}/\${rel}\" \"\${RELEASE_PATH}/storage/\${rel}\"
              done

              # Warm the release while it is still offline (.env injected by Infisical on the server).
              command -v infisical >/dev/null 2>&1 || { echo \"infisical not found in PATH: \$PATH\"; exit 127; }
              cd \"\${RELEASE_PATH}\"
              infisical run --env=${INFISICAL_ENV} --path=/ -- bash -lc \
                \"php artisan migrate --force && php artisan config:cache && php artisan view:cache\"

              # Atomic cutover: traffic keeps hitting the old release until this rename completes.
              ln -sfn \"\${RELEASE_PATH}\" \"\${HOSTINGER_PATH}/current_new\"
              if [ -e \"\${CURRENT}\" ] && [ ! -L \"\${CURRENT}\" ]; then
                mv \"\${CURRENT}\" \"\${HOSTINGER_PATH}/releases/pre-atomic-\$(TZ=Europe/Paris date +%Y%m%d-%H%M%S)\"
              fi
              mv -Tf \"\${HOSTINGER_PATH}/current_new\" \"\${CURRENT}\"
            '"

      # Keep BACKUP_KEEP_COUNT previous releases for manual rollback (ln -sfn <old> current).
      # Never delete the release that `current` currently points at.
      - name: Clean up old releases
        run: |
          KEEP="$((BACKUP_KEEP_COUNT + 1))"
          ssh -i "$HOME/.ssh/hostinger_deploy" $SSH_OPTS \
            -p "$HOSTINGER_PORT" \
            "${HOSTINGER_USER}@${HOSTINGER_HOST}" \
            "bash -lc '
              set -euo pipefail
              RELEASES=\"${HOSTINGER_PATH}/releases\"
              CURRENT_TARGET=\$(readlink -f \"${HOSTINGER_PATH}/current\" || true)
              ls -dt \"\${RELEASES}\"/*/ 2>/dev/null | while read -r dir; do
                [ -n \"\${CURRENT_TARGET}\" ] && [ \"\$(readlink -f \"\${dir}\")\" = \"\${CURRENT_TARGET}\" ] && continue
                echo \"\${dir}\"
              done | tail -n +${KEEP} | xargs -r rm -rf
              # Drop leftover full-tree backups from the previous in-place rsync deploy strategy.
              ls -dt \"${HOSTINGER_PATH}/backups\"/backup-* 2>/dev/null | xargs -r rm -rf
            '"
